<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CharityConnect · Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f7f9fc 0%, #eef2f7 100%);
            min-height: 100vh;
            padding: 1.5rem;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Admin Toggle Button */
        .admin-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #176b87;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 600;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-toggle:hover {
            background: #0f4d62;
        }

        /* Admin Panel */
        .admin-panel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            padding: 2rem;
            z-index: 2000;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .admin-panel.active {
            display: block;
        }

        .admin-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1500;
        }

        .admin-overlay.active {
            display: block;
        }

        .admin-panel h2 {
            color: #176b87;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-input-group {
            margin-bottom: 1.2rem;
        }

        .admin-input-group label {
            font-weight: 600;
            color: #1f3a4b;
            display: block;
            margin-bottom: 5px;
        }

        .admin-input-group input,
        .admin-input-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #dde5ed;
            border-radius: 10px;
            font-size: 1rem;
        }

        .admin-input-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .btn-save {
            background: #176b87;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .btn-close {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Charity Card */
        .charity-card {
            background: white;
            border-radius: 2.5rem;
            box-shadow: 0 30px 50px rgba(0, 20, 30, 0.12);
            display: flex;
            flex-wrap: wrap;
            overflow: hidden;
            margin-top: 1rem;
        }

        .welcome-panel {
            flex: 1 1 40%;
            background: linear-gradient(160deg, #1e4b5e 0%, #176b87 100%);
            padding: 2.5rem 2rem;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .welcome-panel h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .welcome-panel h1 i {
            color: #ffd166;
            margin-right: 10px;
        }

        .tagline {
            font-size: 1.15rem;
            opacity: 0.9;
            margin-bottom: 1.5rem;
        }

        .feature-highlight {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1.8rem;
            padding: 1.2rem 1.5rem;
            margin-top: 1rem;
            border: 1px solid rgba(255,255,255,0.25);
        }

        .feature-highlight p {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .feature-highlight i {
            font-size: 1.6rem;
            color: #ffe5a3;
        }

        .form-panel {
            flex: 1 1 60%;
            padding: 2.2rem 2.5rem;
            background: white;
        }

        .tabs {
            display: flex;
            gap: 1.2rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.7rem;
        }

        .tab-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            font-weight: 600;
            color: #6b7b8c;
            cursor: pointer;
            padding: 0.5rem 0.2rem;
        }

        .tab-btn.active {
            color: #176b87;
            border-bottom: 3px solid #176b87;
        }

        .form-section {
            display: none;
            flex-direction: column;
            gap: 1.1rem;
        }

        .form-section.active {
            display: flex;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #1f3a4b;
        }

        .input-field {
            display: flex;
            align-items: center;
            background: #f8fafd;
            border: 1.5px solid #dde5ed;
            border-radius: 16px;
            padding: 0.75rem 1rem;
        }

        .input-field input,
        .input-field select,
        .input-field textarea {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 1rem;
            outline: none;
        }

        .input-field i {
            margin-right: 12px;
            color: #56748c;
        }

        .bank-host-option {
            background: #f0f6fa;
            border-left: 4px solid #1e4b5e;
            border-radius: 16px;
            padding: 1rem 1.2rem;
            margin: 0.8rem 0;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .bank-host-option i {
            font-size: 2rem;
            color: #176b87;
        }

        .btn-primary {
            background: #176b87;
            color: white;
            border: none;
            padding: 0.9rem 1.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 0.7rem;
        }

        .content-editable {
            transition: all 0.3s;
            border: 2px dashed transparent;
        }

        .content-editable:hover {
            border-color: #ffd166;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Charity Card -->
        <div class="charity-card">
            <!-- Left Panel -->
            <div class="welcome-panel">
                <h1>
                    <i class="fas fa-hands-helping"></i> 
                    <span id="siteName">CharityConnect</span>
                </h1>
                <div class="tagline" id="siteTagline">
                    Empowering everyone to give & host with trust.
                </div>
                <div class="feature-highlight">
                    <p>
                        <i class="fas fa-user-plus"></i> 
                        <span id="feature1">Create your profile – anyone can join.</span>
                    </p>
                </div>
                <div class="feature-highlight">
                    <p>
                        <i class="fas fa-university"></i> 
                        <span id="feature2">Host a bank account – securely link.</span>
                    </p>
                </div>
                <div style="margin-top: 1.2rem; opacity: 0.8; font-size: 0.9rem;" id="securityNote">
                    <i class="fas fa-shield-alt"></i> 256-bit encryption · transparent reporting
                </div>
            </div>

            <!-- Right Panel -->
            <div class="form-panel">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="login">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                    <button class="tab-btn" data-tab="register">
                        <i class="fas fa-user-circle"></i> Create Profile
                    </button>
                </div>

                <!-- Login Section -->
                <div id="login-section" class="form-section active">
                    <div class="input-group">
                        <label><i class="fas fa-envelope"></i> Email or Username</label>
                        <div class="input-field">
                            <i class="fas fa-at"></i>
                            <input type="email" placeholder="you@example.org">
                        </div>
                    </div>
                    <div class="input-group">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <div class="input-field">
                            <i class="fas fa-key"></i>
                            <input type="password" placeholder="••••••••">
                        </div>
                    </div>
                    <button class="btn-primary">Log in to your account</button>
                </div>

                <!-- Register Section -->
                <div id="register-section" class="form-section">
                    <div class="input-group">
                        <label>Full name *</label>
                        <div class="input-field">
                            <i class="fas fa-user"></i>
                            <input type="text" placeholder="e.g., Alex Morgan">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Email address *</label>
                        <div class="input-field">
                            <i class="fas fa-envelope-open-text"></i>
                            <input type="email" placeholder="you@example.com">
                        </div>
                    </div>
                    <div class="bank-host-option">
                        <i class="fas fa-university"></i>
                        <div>
                            <strong>Host a bank account</strong>
                            <span>Enable secure fundraising</span>
                        </div>
                        <input type="checkbox" checked>
                    </div>
                    <button class="btn-primary">Create free profile</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Toggle Button -->
    <button class="admin-toggle" onclick="toggleAdmin()">
        <i class="fas fa-user-shield"></i> Admin
    </button>

    <!-- Admin Overlay -->
    <div class="admin-overlay" id="adminOverlay" onclick="toggleAdmin()"></div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
        <h2><i class="fas fa-edit"></i> Edit Website Content</h2>
        
        <div class="admin-input-group">
            <label>Site Name</label>
            <input type="text" id="editSiteName" placeholder="CharityConnect">
        </div>
        
        <div class="admin-input-group">
            <label>Tagline</label>
            <textarea id="editTagline">Empowering everyone to give & host with trust.</textarea>
        </div>
        
        <div class="admin-input-group">
            <label>Feature 1</label>
            <textarea id="editFeature1">Create your profile – anyone can join.</textarea>
        </div>
        
        <div class="admin-input-group">
            <label>Feature 2</label>
            <textarea id="editFeature2">Host a bank account – securely link.</textarea>
        </div>
        
        <div class="admin-input-group">
            <label>Security Note</label>
            <input type="text" id="editSecurity" value="256-bit encryption · transparent reporting">
        </div>
        
        <button class="btn-save" onclick="saveChanges()">
            <i class="fas fa-save"></i> Save Changes
        </button>
        
        <button class="btn-close" onclick="toggleAdmin()">
            <i class="fas fa-times"></i> Close
        </button>
    </div>

    <script>
        // Load saved content from localStorage
        function loadContent() {
            const content = JSON.parse(localStorage.getItem('charityContent')) || {};
            
            if (content.siteName) document.getElementById('siteName').textContent = content.siteName;
            if (content.tagline) document.getElementById('siteTagline').textContent = content.tagline;
            if (content.feature1) document.getElementById('feature1').textContent = content.feature1;
            if (content.feature2) document.getElementById('feature2').textContent = content.feature2;
            if (content.securityNote) document.getElementById('securityNote').innerHTML = '<i class="fas fa-shield-alt"></i> ' + content.securityNote;
            
            // Populate admin panel inputs
            document.getElementById('editSiteName').value = document.getElementById('siteName').textContent;
            document.getElementById('editTagline').value = document.getElementById('siteTagline').textContent;
            document.getElementById('editFeature1').value = document.getElementById('feature1').textContent;
            document.getElementById('editFeature2').value = document.getElementById('feature2').textContent;
            document.getElementById('editSecurity').value = document.getElementById('securityNote').textContent.replace('🔒 ', '');
        }

        // Save changes to localStorage
        function saveChanges() {
            const content = {
                siteName: document.getElementById('editSiteName').value,
                tagline: document.getElementById('editTagline').value,
                feature1: document.getElementById('editFeature1').value,
                feature2: document.getElementById('editFeature2').value,
                securityNote: document.getElementById('editSecurity').value
            };
            
            localStorage.setItem('charityContent', JSON.stringify(content));
            loadContent();
            toggleAdmin();
            alert('✅ Changes saved successfully!');
        }

        // Toggle admin panel
        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            const overlay = document.getElementById('adminOverlay');
            
            panel.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                const targetTab = this.dataset.tab;
                document.getElementById('login-section').classList.toggle('active', targetTab === 'login');
                document.getElementById('register-section').classList.toggle('active', targetTab === 'register');
            });
        });

        // Initialize
        loadContent();
    </script>
</body>
</html>
